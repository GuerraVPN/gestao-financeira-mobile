name: Build CrediFlow 1.2 APK

on:
  push:
    branches:
      - crediflow-v1.2-build12
    paths:
      - 'crediflow-v08/**'
      - '.github/workflows/crediflow-v08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: crediflow-debug-keystore-v1

      - name: Ensure signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=CrediFlow,C=BR' -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK
        run: gradle -p crediflow-v08 :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp crediflow-v08/app/build/outputs/apk/debug/app-debug.apk CrediFlow-v1.2-build12.apk

      - name: Validate package, launcher and signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging CrediFlow-v1.2-build12.apk | tee apk-badging.txt
          grep -q "package: name='br.com.guerravpn.crediflow.app' versionCode='12' versionName='1.2'" apk-badging.txt
          grep -q "launchable-activity: name='br.com.guerravpn.crediflow.MainActivityV06'" apk-badging.txt
          grep -q "application-icon-160:'res/drawable/ic_crediflow.xml'" apk-badging.txt
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose CrediFlow-v1.2-build12.apk

      - name: Preserve validated APK
        uses: actions/upload-artifact@v4
        with:
          name: CrediFlow-v1.2-build12
          path: |
            CrediFlow-v1.2-build12.apk
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Boot Android and smoke-test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r CrediFlow-v1.2-build12.apk
            adb logcat -c
            adb shell am force-stop br.com.guerravpn.crediflow.app
            adb shell am start -n br.com.guerravpn.crediflow.app/br.com.guerravpn.crediflow.MainActivityV06 | tee launch.txt
            sleep 20
            adb shell pidof br.com.guerravpn.crediflow.app | tee pid.txt
            test -s pid.txt
            adb shell dumpsys activity activities > activities.txt
            grep -q 'br.com.guerravpn.crediflow.MainActivityV06' activities.txt
            adb logcat -d > app-logcat.txt
            adb exec-out screencap -p > CrediFlow-v1.2-build12-smoke.png
            test -s CrediFlow-v1.2-build12-smoke.png

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrediFlow-v1.2-build12-smoke-evidence
          path: |
            CrediFlow-v1.2-build12-smoke.png
            launch.txt
            pid.txt
            activities.txt
            app-logcat.txt
          if-no-files-found: warn
          retention-days: 30
