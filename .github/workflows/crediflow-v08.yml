name: Build CrediFlow 0.8 APK

on:
  push:
    branches:
      - crediflow-v0.8-build
    paths:
      - 'crediflow-v08/**'
      - '.github/workflows/crediflow-v08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: crediflow-debug-keystore-v1

      - name: Ensure signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=CrediFlow,C=BR' -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK
        run: gradle -p crediflow-v08 :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp crediflow-v08/app/build/outputs/apk/debug/app-debug.apk CrediFlow-v0.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrediFlow-v0.8
          path: CrediFlow-v0.8.apk
          if-no-files-found: error
          retention-days: 30
