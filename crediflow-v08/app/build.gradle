plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.guerravpn.crediflow.v08'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.guerravpn.crediflow.v08'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
