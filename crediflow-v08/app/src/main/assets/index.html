<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#051222" />
<title>CrediFlow 0.8</title>
<style>
:root{--bg:#051222;--surface:#0d2238;--surface2:#12304d;--line:#264766;--text:#f5f7fb;--muted:#9db2ca;--blue:#2782ff;--green:#18b777;--amber:#ffbd3d;--red:#ff5d6c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:28px 20px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.logo{width:54px;height:54px;border-radius:18px;background:var(--blue);display:grid;place-items:center;font-size:32px;font-weight:900}.brand h1{font-size:28px;margin:0}.brand p{margin:3px 0 0;color:var(--muted)}.tag{color:#62a9ff;text-transform:uppercase;font-weight:800;letter-spacing:.06em;font-size:13px}.hero{font-size:42px;line-height:1.05;margin:18px 0 12px;font-weight:900}.sub{color:var(--muted);line-height:1.55}.card{background:var(--surface);border:1px solid #102b46;border-radius:20px;padding:20px;margin:14px 0}.card h2,.card h3{margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--surface2);border-radius:16px;padding:14px}.stat small{color:var(--muted);display:block}.stat b{display:block;font-size:20px;margin-top:4px}.btn{border:0;border-radius:15px;padding:15px 18px;font-weight:800;color:#fff;background:var(--blue);width:100%;margin:6px 0}.btn.alt{background:transparent;border:1px solid #476078;color:#dfe8f2}.btn.good{background:var(--green)}.btn.warn{background:#8f691d}.btn.danger{background:#a6333f}.btn.sm{width:auto;padding:9px 12px;border-radius:10px;font-size:13px}.field{margin:12px 0}.field label{display:block;color:#b9c9dc;font-size:13px;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid #31506d;background:#071a2d;color:#fff;border-radius:13px;padding:14px;outline:none}.field textarea{min-height:100px;resize:vertical}.muted{color:var(--muted)}.small{font-size:13px}.notice{padding:12px 14px;border-radius:14px;background:#0a2d4e;border:1px solid #164d78;color:#bddcff;margin:12px 0}.ok{color:#56df9e}.warnText{color:#ffc95c}.bad{color:#ff8792}.divider{height:1px;background:#17344f;margin:18px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1;min-width:130px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#183955;color:#b9d6f4;font-size:12px;font-weight:700}.bottom{position:fixed;left:0;right:0;bottom:0;background:#07192b;border-top:1px solid #18334d;display:flex;justify-content:center;padding:8px 10px env(safe-area-inset-bottom)}.bottom .inner{display:flex;max-width:720px;width:100%;gap:4px}.nav{flex:1;background:transparent;border:0;color:#8da6bf;padding:10px 4px;font-size:12px}.nav.active{color:#5aa4ff;font-weight:800}.bigmoney{font-size:34px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:28px 10px}.loader{padding:40px;text-align:center;color:var(--muted)}.contract{white-space:pre-wrap;background:#06182a;border:1px solid #24435f;border-radius:14px;padding:14px;max-height:260px;overflow:auto;font-size:13px;line-height:1.5}.item{padding:14px 0;border-bottom:1px solid #18324a}.item:last-child{border:0}.right{text-align:right}.link{color:#67aaff;text-decoration:none;font-weight:700}.version{color:#7890aa;font-size:12px;margin-top:32px}.dangerbox{background:#311821;border:1px solid #6f2b3a;color:#ffbdc5;border-radius:14px;padding:12px}.successbox{background:#0d3228;border:1px solid #17634b;color:#a9f1d0;border-radius:14px;padding:12px}@media(max-width:560px){.row,.grid3{grid-template-columns:1fr}.hero{font-size:36px}.app{padding:20px 16px 105px}.brand h1{font-size:24px}}
</style>
</head>
<body><div id="root"></div>
<script>
const SUPA='https://xvhbydoslqmnjjsnyvus.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2aGJ5ZG9zbHFtbmpqc255dnVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTE4NTcsImV4cCI6MjEwNDcyNzg1N30.hcu_4_hQ4sB7pMs7HLbHGCGXIH7wFCJ1V0C_qJ_SF7w';
let session=JSON.parse(localStorage.getItem('cf_session')||'null');
let appRef=JSON.parse(localStorage.getItem('cf_application')||'null');
let screen=session?'home':'welcome'; let nav='home';
const $=s=>document.querySelector(s); const root=$('#root');
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=v=>(Number(v||0)*100).toLocaleString('pt-BR',{maximumFractionDigits:4})+'%';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const dateBR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'-';
function toast(msg,type='ok'){const d=document.createElement('div');d.className=type==='bad'?'dangerbox':'successbox';d.style='position:fixed;top:18px;left:18px;right:18px;z-index:99;max-width:680px;margin:auto;box-shadow:0 10px 30px #0008';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
async function req(path,{method='GET',body,token,headers={}}={}){const h={'apikey':ANON,...headers};h.Authorization='Bearer '+(token||ANON);if(body!==undefined){h['Content-Type']='application/json'}const r=await fetch(SUPA+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok){const m=d?.error_description||d?.msg||d?.message||d?.error||t||('HTTP '+r.status);throw new Error(m)}return d}
async function authReq(path,method,body,token){return req('/auth/v1'+path,{method,body,token})}
async function edge(name,method='POST',body){return req('/functions/v1/'+name,{method,body,token:session?.access_token})}
async function rest(path,method='GET',body,prefer){const headers={};if(prefer)headers.Prefer=prefer;return req('/rest/v1/'+path,{method,body,token:session?.access_token,headers})}
function saveSession(s){session=s;localStorage.setItem('cf_session',JSON.stringify(s))}
function logout(){session=null;localStorage.removeItem('cf_session');screen='welcome';nav='home';render()}
function role(){return session?.user?.app_metadata?.role||''}
function shell(content,title='CrediFlow',subtitle='Crédito que impulsiona você',withNav=false){root.innerHTML=`<main class="app"><div class="top"><div class="brand"><div class="logo">C</div><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div></div>${session?'<button class="btn alt sm" id="logout">Sair</button>':''}</div>${content}<div class="version">CrediFlow · 0.8 · Professional</div></main>${withNav?`<div class="bottom"><div class="inner"><button class="nav ${nav==='home'?'active':''}" data-nav="home">Início</button><button class="nav ${nav==='loan'?'active':''}" data-nav="loan">Crédito</button><button class="nav ${nav==='payments'?'active':''}" data-nav="payments">Parcelas</button><button class="nav ${nav==='account'?'active':''}" data-nav="account">Conta</button></div></div>`:''}`;$('#logout')?.addEventListener('click',logout);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{nav=b.dataset.nav;renderClient()})}
function render(){if(!session){if(screen==='register')return renderRegister();if(screen==='status')return renderStatus();if(screen==='activate')return renderActivate();return renderWelcome()}if(role()==='admin')return renderAdmin();return renderClient()}
function renderWelcome(){shell(`<div class="tag">Crediflow</div><div class="hero">Crédito simples,<br>análise clara.</div><p class="sub">Cadastro, análise manual, limite progressivo, solicitação via Pix e contrato eletrônico. Nesta versão o Open Finance não faz parte do fluxo.</p><button class="btn" id="create">Criar cadastro</button><button class="btn alt" id="loginBtn">Entrar na minha conta</button><button class="btn alt" id="statusBtn">Acompanhar cadastro</button><div class="card"><h3>Fluxo da conta</h3><p class="muted">Cadastro → documentos → análise manual → aprovação → código por e-mail → criação da senha.</p></div><div id="loginBox" class="card" style="display:none"><h3>Entrar</h3><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="doLogin">Entrar</button></div>`);$('#create').onclick=()=>{screen='register';render()};$('#statusBtn').onclick=()=>{screen='status';render()};$('#loginBtn').onclick=()=>$('#loginBox').style.display='block';$('#doLogin').onclick=login}
async function login(){try{const email=$('#email').value.trim(),password=$('#password').value;const s=await req('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});saveSession(s);nav='home';toast('Conta conectada.');render()}catch(e){toast('Falha no login: '+e.message,'bad')}}
function renderRegister(){shell(`<button class="btn alt sm" id="back">← Voltar</button><div class="card"><h2>Novo cadastro</h2><p class="muted">Preencha seus dados para análise manual.</p><div class="field"><label>Nome completo</label><input id="rname"></div><div class="row"><div class="field"><label>E-mail</label><input id="remail" type="email"></div><div class="field"><label>Celular</label><input id="rphone" inputmode="tel"></div></div><div class="row"><div class="field"><label>CPF</label><input id="rcpf" inputmode="numeric"></div><div class="field"><label>Data de nascimento</label><input id="rbirth" type="date"></div></div><div class="row"><div class="field"><label>Rua</label><input id="rstreet"></div><div class="field"><label>Número</label><input id="rnumber"></div></div><div class="field"><label>Complemento</label><input id="rcomp"></div><div class="row"><div class="field"><label>Bairro</label><input id="rneigh"></div><div class="field"><label>Cidade</label><input id="rcity"></div></div><div class="row"><div class="field"><label>UF</label><input id="rstate" maxlength="2"></div><div class="field"><label>CEP</label><input id="rcep" inputmode="numeric"></div></div><div class="row"><div class="field"><label>Profissão</label><input id="rocc"></div><div class="field"><label>Renda mensal</label><input id="rincome" type="number" step="0.01"></div></div><button class="btn" id="submitReg">Enviar cadastro</button></div>`);$('#back').onclick=()=>{screen='welcome';render()};$('#submitReg').onclick=submitRegistration}
function randomSecret(){const a=new Uint8Array(32);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function submitRegistration(){try{const secret=randomSecret();const body={p_full_name:$('#rname').value.trim(),p_email:$('#remail').value.trim(),p_cpf:$('#rcpf').value,p_phone:$('#rphone').value,p_birth_date:$('#rbirth').value,p_address_line:$('#rstreet').value.trim(),p_address_number:$('#rnumber').value.trim(),p_address_complement:$('#rcomp').value.trim(),p_neighborhood:$('#rneigh').value.trim(),p_city:$('#rcity').value.trim(),p_state:$('#rstate').value.trim(),p_postal_code:$('#rcep').value,p_occupation:$('#rocc').value.trim(),p_monthly_income:Number($('#rincome').value||0),p_status_secret:secret};const d=await req('/rest/v1/rpc/submit_credit_application',{method:'POST',body});const x=Array.isArray(d)?d[0]:d;appRef={id:x.application_id,secret,email:body.p_email};localStorage.setItem('cf_application',JSON.stringify(appRef));toast('Cadastro enviado. Agora envie os documentos.');screen='status';render()}catch(e){toast('Não foi possível enviar: '+e.message,'bad')}}
function appRefBox(){return appRef?`<div class="notice">Protocolo: <b>${esc(appRef.id)}</b><br><span class="small">Este protocolo ficou salvo neste aparelho.</span></div>`:''}
function renderStatus(){shell(`<button class="btn alt sm" id="back">← Início</button><div class="card"><h2>Acompanhar cadastro</h2>${appRefBox()}${!appRef?`<div class="field"><label>ID do protocolo</label><input id="sid"></div><div class="field"><label>Chave de acompanhamento</label><input id="ssecret"></div><div class="field"><label>E-mail do cadastro</label><input id="semail" type="email"></div><button class="btn" id="saveRef">Usar protocolo</button>`:`<button class="btn" id="refreshStatus">Atualizar situação</button><button class="btn alt" id="forgetRef">Usar outro protocolo</button><div id="statusData"></div><div class="divider"></div><h3>Documentos</h3><p class="muted small">Identidade frente/verso: JPG, PNG ou WEBP. Contracheque: imagem ou PDF, até 10 MB.</p><div class="field"><label>Documento de identidade · frente</label><input id="fFront" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="btn alt" data-upload="identity_front" data-input="fFront">Enviar frente</button><div class="field"><label>Documento de identidade · verso</label><input id="fBack" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="btn alt" data-upload="identity_back" data-input="fBack">Enviar verso</button><div class="field"><label>Contracheque</label><input id="fPay" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><button class="btn alt" data-upload="payslip" data-input="fPay">Enviar contracheque</button>`}</div>`);$('#back').onclick=()=>{screen='welcome';render()};if(!appRef){$('#saveRef').onclick=()=>{appRef={id:$('#sid').value.trim(),secret:$('#ssecret').value.trim(),email:$('#semail').value.trim()};localStorage.setItem('cf_application',JSON.stringify(appRef));render()};return}$('#forgetRef').onclick=()=>{appRef=null;localStorage.removeItem('cf_application');render()};$('#refreshStatus').onclick=refreshStatus;document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>uploadDoc(b.dataset.upload,b.dataset.input));refreshStatus()}
async function refreshStatus(){try{const d=await req('/rest/v1/rpc/check_credit_application_status',{method:'POST',body:{p_application_id:appRef.id,p_status_secret:appRef.secret}});const s=Array.isArray(d)?d[0]:d;if(!s)throw new Error('Protocolo ou chave inválidos');const docs=s.document_status||{};$('#statusData').innerHTML=`<div class="card"><div class="tag">Situação</div><h2>${esc(s.application_status)}</h2><p>Verificação: <b>${s.verification_score??0}/100</b> · ${esc(s.verification_level||'-')}</p><p class="muted">Frente: ${esc(docs.identity_front||'pendente')} · Verso: ${esc(docs.identity_back||'pendente')} · Contracheque: ${esc(docs.payslip||'pendente')}</p>${s.approved_limit!=null?`<div class="bigmoney">${money(s.approved_limit)}</div><p class="muted">Limite aprovado</p>`:''}${s.correction_note?`<div class="dangerbox">Correção solicitada: ${esc(s.correction_note)}<br>${(s.correction_fields||[]).map(esc).join(', ')}</div>`:''}${s.application_status==='activation_sent'?'<button class="btn good" id="goActivate">Recebi o código por e-mail</button>':''}</div>`;$('#goActivate')?.addEventListener('click',()=>{screen='activate';render()})}catch(e){toast('Não foi possível consultar: '+e.message,'bad')}}
function fileBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsDataURL(file)})}
async function uploadDoc(kind,inputId){try{const f=$('#'+inputId).files[0];if(!f)return toast('Selecione um arquivo.','bad');const base64=await fileBase64(f);await req('/functions/v1/application-document-upload',{method:'POST',body:{applicationId:appRef.id,statusSecret:appRef.secret,kind,mimeType:f.type,base64}});toast('Documento enviado.');refreshStatus()}catch(e){toast('Erro no envio: '+e.message,'bad')}}
function renderActivate(){shell(`<button class="btn alt sm" id="back">← Voltar</button><div class="card"><h2>Ativar conta</h2><p class="muted">Digite o código recebido no e-mail ${esc(appRef?.email||'')} e crie sua senha.</p><div class="field"><label>Código</label><input id="otp" inputmode="numeric"></div><div class="field"><label>Nova senha</label><input id="newPass" type="password"></div><div class="field"><label>Confirmar senha</label><input id="newPass2" type="password"></div><button class="btn" id="activate">Ativar minha conta</button></div>`);$('#back').onclick=()=>{screen='status';render()};$('#activate').onclick=activateAccount}
async function activateAccount(){try{const p=$('#newPass').value;if(p.length<8||p!==$('#newPass2').value)throw new Error('A senha precisa ter 8 ou mais caracteres e coincidir.');const v=await req('/auth/v1/verify',{method:'POST',body:{type:'email',email:appRef.email,token:$('#otp').value.trim()}});if(!v?.access_token)throw new Error('Código inválido ou expirado');await req('/auth/v1/user',{method:'PUT',body:{password:p},token:v.access_token});const temp={...v};session=temp;await edge('complete-activation','POST',{});saveSession(temp);toast('Conta ativada.');nav='home';render()}catch(e){session=null;toast('Falha na ativação: '+e.message,'bad')}}
async function renderClient(){if(nav==='loan')return renderLoan();if(nav==='payments')return renderPayments();if(nav==='account')return renderAccount();shell('<div class="loader">Carregando sua conta…</div>','CrediFlow','Minha conta',true);try{const limits=await rest('credit_limits?select=*&active=eq.true&limit=1');const limit=limits?.[0];const loans=await rest('loans?select=id,principal,total_amount,status,installments_count,first_due_date,requested_at&order=requested_at.desc&limit=10');const active=(loans||[]).filter(x=>['requested','approved','disbursing','active','late'].includes(x.status)).reduce((s,x)=>s+Number(x.principal||0),0);const available=Math.max(0,Number(limit?.limit_amount||0)-active);shell(`<div class="card"><div class="tag">Limite disponível</div><div class="bigmoney">${money(available)}</div><p class="muted">de ${money(limit?.limit_amount||0)} · taxa ${pct(limit?.monthly_rate||0)} a.m. · até ${limit?.max_installments||1} parcela(s)</p></div><div class="row"><div class="stat"><small>Multa por atraso</small><b>${pct(limit?.late_fee_rate||0)}</b></div><div class="stat"><small>Juros de mora</small><b>${pct(limit?.late_interest_daily_rate||0)} ao dia</b></div></div><div class="card"><h3>Meus empréstimos</h3>${(loans||[]).length?(loans||[]).map(l=>`<div class="item"><div class="actions"><div style="flex:1"><b>${money(l.principal)}</b><div class="muted small">${l.installments_count}x · 1º venc. ${dateBR(l.first_due_date)}</div></div><span class="pill">${esc(l.status)}</span></div></div>`).join(''):'<div class="empty">Nenhuma solicitação ainda.</div>'}</div>`, 'CrediFlow','Minha conta',true)}catch(e){shell(`<div class="dangerbox">Erro ao carregar: ${esc(e.message)}</div>`,'CrediFlow','Minha conta',true)}}
function tomorrowPlus(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
async function renderLoan(){shell(`<div class="card"><h2>Solicitar empréstimo</h2><p class="muted">Simule primeiro. O valor só é liberado após confirmação manual do Admin.</p><div class="row"><div class="field"><label>Valor desejado</label><input id="loanAmount" type="number" min="1" step="0.01"></div><div class="field"><label>Parcelas</label><input id="loanInst" type="number" min="1" max="60" value="1"></div></div><div class="field"><label>Data da primeira parcela</label><input id="firstDue" type="date" value="${tomorrowPlus(30)}"></div><div class="row"><div class="field"><label>Tipo da chave Pix</label><select id="pixType"><option value="cpf">CPF</option><option value="phone">Celular</option><option value="email">E-mail</option><option value="random">Aleatória</option></select></div><div class="field"><label>Chave Pix</label><input id="pixKey"></div></div><button class="btn" id="preview">Simular proposta</button><div id="previewBox"></div></div>`,'CrediFlow','Novo crédito',true);$('#preview').onclick=previewLoan}
async function previewLoan(){try{const body={amount:Number($('#loanAmount').value),installments:Number($('#loanInst').value),firstDueDate:$('#firstDue').value};const p=await edge('client-loan-preview','POST',body);$('#previewBox').innerHTML=`<div class="divider"></div><div class="grid3"><div class="stat"><small>Parcela</small><b>${money(p.installmentValue)}</b></div><div class="stat"><small>Juros</small><b>${money(p.interestAmount)}</b></div><div class="stat"><small>Total</small><b>${money(p.total)}</b></div></div><p class="muted small">Taxa ${pct(p.monthlyRate)} a.m. · primeira parcela ${dateBR(p.firstDueDate)} · multa ${pct(p.lateFeeRate)} · mora ${pct(p.lateInterestDailyRate)}/dia</p><div class="contract">${esc(p.contractBody)}</div><label class="small"><input type="checkbox" id="accepted"> Li e concordo com o contrato e as condições acima.</label><button class="btn good" id="submitLoan">Confirmar solicitação</button>`;$('#submitLoan').onclick=()=>submitLoan(p)}catch(e){toast('Não foi possível simular: '+e.message,'bad')}}
async function submitLoan(preview){try{if(!$('#accepted').checked)throw new Error('Leia e aceite o contrato.');const pixKey=$('#pixKey').value.trim();if(!pixKey)throw new Error('Informe sua chave Pix.');const r=await edge('client-loan-request','POST',{amount:preview.amount,installments:preview.installments,firstDueDate:preview.firstDueDate,pixKeyType:$('#pixType').value,pixKey,repaymentMethod:'pix',readingChoice:'read'});toast('Solicitação enviada. Contrato '+r.contractNumber);nav='home';renderClient()}catch(e){toast('Falha ao solicitar: '+e.message,'bad')}}
async function renderPayments(){shell('<div class="loader">Carregando parcelas…</div>','CrediFlow','Parcelas',true);try{const rows=await rest('installments?select=*&order=due_date.asc');shell(`<div class="card"><h2>Parcelas</h2>${(rows||[]).length?(rows||[]).map(x=>`<div class="item"><div class="actions"><div style="flex:1"><b>${x.installment_number}ª · ${money(x.amount_due)}</b><div class="muted small">Vence ${dateBR(x.due_date)} · pago ${money(x.amount_paid)}</div></div><span class="pill">${esc(x.status)}</span></div></div>`).join(''):'<div class="empty">Nenhuma parcela gerada.</div>'}</div>`,'CrediFlow','Parcelas',true)}catch(e){shell(`<div class="dangerbox">${esc(e.message)}</div>`,'CrediFlow','Parcelas',true)}}
function renderAccount(){shell(`<div class="card"><h2>Conta</h2><p><b>${esc(session?.user?.email||'')}</b></p><p class="muted">Perfil: ${esc(role()||'cliente')}</p><button class="btn danger" id="logout2">Sair da conta</button></div>`,'CrediFlow','Minha conta',true);$('#logout2').onclick=logout}
async function renderAdmin(){shell('<div class="loader">Carregando Painel Admin…</div>','Painel Admin','Visão geral da operação');try{const apps=await rest('credit_applications?select=*&order=created_at.desc&limit=100');const loans=await edge('admin-loan-requests','GET');const pending=(apps||[]).filter(x=>['under_review','correction_required','approved','activation_sent'].includes(x.status));shell(`<div class="row"><div class="stat"><small>Cadastros</small><b>${(apps||[]).length}</b></div><div class="stat"><small>Em análise</small><b>${pending.length}</b></div></div><div class="card"><h2>Análises</h2>${pending.length?pending.map(adminApplicationCard).join(''):'<div class="empty">Nenhum cadastro pendente.</div>'}</div><div class="card"><h2>Solicitações de crédito</h2>${(loans.items||[]).length?(loans.items||[]).map(adminLoanCard).join(''):'<div class="empty">Nenhuma solicitação.</div>'}</div><button class="btn alt" id="refreshAdmin">Atualizar painel</button>`, 'Painel Admin','Visão geral da operação');$('#refreshAdmin').onclick=renderAdmin;document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>adminApprove(b.dataset.approve));document.querySelectorAll('[data-reject-app]').forEach(b=>b.onclick=()=>adminRejectApp(b.dataset.rejectApp));document.querySelectorAll('[data-activation]').forEach(b=>b.onclick=()=>adminSendActivation(b.dataset.activation));document.querySelectorAll('[data-disburse]').forEach(b=>b.onclick=()=>adminDisburse(b.dataset.disburse));document.querySelectorAll('[data-reject-loan]').forEach(b=>b.onclick=()=>adminRejectLoan(b.dataset.rejectLoan))}catch(e){shell(`<div class="dangerbox">Erro no Admin: ${esc(e.message)}</div>`,'Painel Admin','Visão geral da operação')}}
function adminApplicationCard(a){const id=esc(a.id);return `<div class="item"><div class="actions"><div style="flex:1"><b>${esc(a.full_name)}</b><div class="muted small">${esc(a.email)} · ${esc(a.status)}</div></div><span class="pill">${esc(a.status)}</span></div>${['under_review','correction_required'].includes(a.status)?`<div class="row"><div class="field"><label>Limite aprovado</label><input id="lim_${id}" type="number" value="50"></div><div class="field"><label>Juros ao mês (%)</label><input id="rate_${id}" type="number" step="0.01" value="3"></div></div><div class="row"><div class="field"><label>Máx. parcelas</label><input id="inst_${id}" type="number" value="1"></div><div class="field"><label>Risco</label><select id="risk_${id}"><option>baixo</option><option>medio</option><option>alto</option></select></div></div><div class="row"><div class="field"><label>Juros atraso/dia (%)</label><input id="late_${id}" type="number" step="0.001" value="0.1"></div><div class="field"><label>Multa atraso (%)</label><input id="fee_${id}" type="number" step="0.01" value="2"></div></div><div class="field"><label>Observações</label><textarea id="note_${id}"></textarea></div><div class="actions"><button class="btn good sm" data-approve="${id}">Aprovar</button><button class="btn danger sm" data-reject-app="${id}">Rejeitar</button></div>`:''}${['approved','activation_sent'].includes(a.status)?`<button class="btn good sm" data-activation="${id}">${a.status==='activation_sent'?'Reenviar código':'Enviar código de ativação'}</button>`:''}</div>`}
function adminLoanCard(l){return `<div class="item"><div class="actions"><div style="flex:1"><b>${esc(l.profile?.full_name||l.profile?.email||l.user_id)}</b><div class="muted small">${money(l.principal)} · ${l.installments_count}x · juros ${money(l.interest_amount)} · total ${money(l.total_amount)}</div><div class="muted small">1º venc. ${dateBR(l.first_due_date)} · Pix ${esc(l.pix?.key_type||'')} ${esc(l.pix?.key_masked||'')}</div></div><span class="pill">${esc(l.status)}</span></div>${l.status==='requested'?`<div class="actions"><button class="btn good sm" data-disburse="${esc(l.id)}">Confirmar Pix enviado</button><button class="btn danger sm" data-reject-loan="${esc(l.id)}">Rejeitar</button></div>`:''}</div>`}
async function adminApprove(id){try{await edge('admin-record-review','POST',{applicationId:id,decision:'approved',approvedLimit:Number($('#lim_'+id).value),riskTier:$('#risk_'+id).value,monthlyRate:Number($('#rate_'+id).value)/100,maxInstallments:Number($('#inst_'+id).value),lateInterestDailyRate:Number($('#late_'+id).value)/100,lateFeeRate:Number($('#fee_'+id).value)/100,notes:$('#note_'+id).value.trim()});toast('Cadastro aprovado.');renderAdmin()}catch(e){toast('Falha na aprovação: '+e.message,'bad')}}
async function adminRejectApp(id){try{const note=$('#note_'+id)?.value.trim()||prompt('Motivo da rejeição:')||'';await edge('admin-record-review','POST',{applicationId:id,decision:'rejected',notes:note});toast('Cadastro rejeitado.');renderAdmin()}catch(e){toast('Falha: '+e.message,'bad')}}
async function adminSendActivation(id){try{await edge('admin-send-activation','POST',{applicationId:id});toast('Código enviado por e-mail.');renderAdmin()}catch(e){toast('Falha ao enviar código: '+e.message,'bad')}}
async function adminDisburse(id){try{const note=prompt('Observação da transferência Pix (opcional):')||'';await edge('admin-confirm-disbursement','POST',{loanId:id,note});toast('Liberação confirmada e parcelas geradas.');renderAdmin()}catch(e){toast('Falha ao confirmar: '+e.message,'bad')}}
async function adminRejectLoan(id){try{const note=prompt('Motivo da rejeição:')||'';await edge('admin-reject-loan-request','POST',{loanId:id,note});toast('Solicitação rejeitada.');renderAdmin()}catch(e){toast('Falha: '+e.message,'bad')}}
render();
</script></body></html>
